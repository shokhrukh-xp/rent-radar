# Сторож сервера Ra'no: раз в 30 минут дёргает воркер, он проверяет, когда сервер последний раз забирал
# очередь сообщений. Молчит 25+ минут — воркер пишет владельцу в Telegram (не чаще раза в 6 часов).
# Cron-триггеры Cloudflare на бесплатном плане заняты, поэтому расписание здесь. Секреты не нужны.
name: Ra'no watchdog
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 30 https://rano-bot.sh-pulatov.workers.dev/watch
