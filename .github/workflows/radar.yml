# Rent Radar на GitHub Actions.
# Лежит в репозитории по пути:  .github/workflows/radar.yml
#
# Раньше был короткий прогон по cron */5 — но GitHub сильно троттлит частые
# расписания (реально запускалось раз в 20–40 минут), и бот «не отвечал».
# Теперь один запуск живёт ~50 минут: команды и кнопки обрабатываются за
# секунду (long-poll), объявления проверяются раз в 1–3 минуты, а состояние
# сохраняется каждые 10 минут — чтобы ничего не потерялось при обрыве.
#
# Данные (radar.db, sale.db) — НЕ в этом публичном репозитории, а в приватном
# shokhrukh-xp/rent-radar-state. Доступ — deploy key с правом записи, его
# приватная часть лежит в секрете STATE_DEPLOY_KEY.
name: Rent Radar

# С 10.10.2026 Ra'no работает круглосуточно на своём сервере (deploy/server).
# Здесь — только ручной запасной запуск. Не запускайте его, пока работает сервер:
# оба будут писать в одну базу.
on:
  workflow_dispatch: {}

permissions:
  contents: read             # в публичный репозиторий радар больше ничего не пишет

concurrency:
  group: rent-radar
  cancel-in-progress: false   # не убиваем работающий радар, ставим в очередь

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout state (private repo)
        uses: actions/checkout@v4
        with:
          repository: shokhrukh-xp/rent-radar-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Run radar (~50 min, state saved every 10)
        env:
          RADAR_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RADAR_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_STATE_DIR: ${{ github.workspace }}/state
          # обновления Telegram принимает webhook-воркер (worker/), отсюда — его очередь
          RADAR_WORKER_URL: ${{ secrets.RADAR_WORKER_URL }}
          RADAR_WORKER_KEY: ${{ secrets.RADAR_WORKER_KEY }}
        run: |
          git -C state config user.name "rent-radar"
          git -C state config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python rent_radar.py --minutes 10 || true
            # История данных не нужна: держим один коммит и перезаписываем его,
            # чтобы приватный репозиторий не разрастался от бинарных снимков базы.
            git -C state add radar.db sale.db || true
            git -C state commit -q --amend -m "state $(date -u +'%Y-%m-%d %H:%M')" || true
            git -C state push -q --force origin HEAD:main || true
          done
