<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rano · uy-joy | поиск жилья</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --ink: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #007aff);
    --btn: var(--tg-theme-button-color, #007aff);
    --btn-ink: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:10px 12px calc(92px + env(safe-area-inset-bottom));
  }
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 10px}
  h1{font-size:18px;margin:0;letter-spacing:-.02em}
  .lead{color:var(--hint);font-size:12.5px;margin:2px 2px 10px}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
  .seg div{padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--hint)}
  .seg div.on{background:var(--btn);color:var(--btn-ink)}

  .card{background:var(--sec);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .card > * + *{border-top:1px solid var(--line)}
  .rowi{display:flex;justify-content:space-between;align-items:center;gap:12px;
        padding:11px 14px;min-height:44px;cursor:pointer;user-select:none}
  .rowi:active{background:color-mix(in srgb, var(--hint) 8%, var(--sec))}
  .rl{font-weight:600;white-space:nowrap;font-size:14.5px}
  .rv{color:var(--btn);font-weight:600;font-size:14px;text-align:right;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}
  .rv .chev{color:var(--hint);font-weight:400;margin-left:5px;display:inline-block;
            transition:transform .15s ease}
  .rowi.open .chev{transform:rotate(90deg)}
  .exp{padding:2px 14px 13px;background:color-mix(in srgb, var(--bg) 35%, var(--sec))}

  .chips{display:flex;flex-wrap:wrap;gap:7px;padding-top:9px}
  .chip{
    border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:10px;padding:7px 12px;font-size:13.5px;cursor:pointer;
    user-select:none;min-height:34px;display:flex;align-items:center;
    transition:transform .06s ease
  }
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600}
  .grid3 .chip{flex:1 1 calc(33.333% - 5px);justify-content:center;text-align:center}
  .grid2 .chip{flex:1 1 calc(50% - 4px);justify-content:center;text-align:center}
  .row{display:flex;gap:8px;align-items:center;margin-top:9px}
  input[type=number],input[type=text]{
    flex:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);
    border-radius:10px;padding:9px 12px;font-size:16px;min-width:0
  }
  input:focus{outline:none;border-color:var(--btn)}

  /* инлайн-календарь */
  .cal{padding-top:10px}
  .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .calhead b{font-size:14.5px;font-weight:600}
  .calnav{width:34px;height:34px;border:1.5px solid var(--line);border-radius:9px;
          display:flex;align-items:center;justify-content:center;cursor:pointer;
          font-size:18px;line-height:1;color:var(--ink)}
  .calnav:active{transform:scale(.93)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .caldow{text-align:center;font-size:11px;color:var(--hint);padding:1px 0 3px}
  .calday{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
          font-size:13.5px;border-radius:9px;cursor:pointer;user-select:none;color:var(--ink)}
  .calday.mut{opacity:.3;cursor:default}
  .calday.rng{background:color-mix(in srgb,var(--btn) 20%,transparent);border-radius:0}
  .calday.sel{background:var(--btn);color:var(--btn-ink);font-weight:700;border-radius:9px}
  .calday.today:not(.sel){box-shadow:inset 0 0 0 1.5px var(--btn)}
  .calnote{color:var(--hint);font-size:12.5px;margin-top:8px;text-align:center}
  .calnote b{color:var(--btn)}
  .preview{
    background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:13.5px;white-space:pre-wrap;color:var(--ink);
    margin-top:9px;max-height:240px;overflow:auto
  }
  .muted{color:var(--hint);font-size:12.5px;margin-top:7px}
  .fallback{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--btn);color:var(--btn-ink);border:0;border-radius:13px;
    padding:15px;font-size:16px;font-weight:600;width:calc(100% - 24px);display:none}
</style>
</head>

// ------------------------------------------------- даты и календарь ------
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+
                          "-"+String(d.getDate()).padStart(2,"0"); }
function fromIso(s){ if(!s) return null; const p=String(s).split("-").map(Number);
  if(p.length!==3||!p[0]) return null; const d=new Date(p[0],p[1]-1,p[2]); d.setHours(0,0,0,0); return d; }
function nights(a,b){ const x=fromIso(a), y=fromIso(b);
  return x&&y ? Math.round((y-x)/86400000) : 0; }
// «15 авг» — для сводки; «15 августа» / «15-avgust» / «August 15» — для письма
function dShort(iso){ const d=fromIso(iso); return d ? d.getDate()+" "+L().monS[d.getMonth()] : ""; }
function dLong(iso, lang){ const d=fromIso(iso); if(!d) return "";
  const t=T[lang]||T.ru, day=d.getDate(), m=d.getMonth();
  if(lang==="uz") return day+"-"+t.monG[m];
  if(lang==="en") return t.monG[m]+" "+day;
  return day+" "+t.monG[m]; }

let calView = null;   // {y,m} показанный месяц (сбрасывается при закрытии строки)

function buildCalendar(mode){   // mode: "range" (date_from/date_to) | "single" (movein_date)
  const wrap = document.createElement("div"); wrap.className = "cal";
  const t = today0();
  if(!calView){
    const base = fromIso(mode==="range" ? A.date_from : A.movein_date) || t;
    calView = {y:base.getFullYear(), m:base.getMonth()};
  }
  function draw(){
    wrap.innerHTML = "";
    const head = document.createElement("div"); head.className = "calhead";
    const prev = document.createElement("div"); prev.className = "calnav"; prev.textContent = "‹";
    prev.onclick = e=>{ e.stopPropagation();
      if(calView.y>t.getFullYear() || calView.m>t.getMonth() || calView.y>t.getFullYear()){
        calView.m--; if(calView.m<0){calView.m=11; calView.y--;} draw();
      }};
    // не листаем в прошлое дальше текущего месяца
    const canPrev = (calView.y>t.getFullYear()) || (calView.y===t.getFullYear() && calView.m>t.getMonth());
    if(!canPrev) prev.style.opacity = ".3";
    const nxt = document.createElement("div"); nxt.className = "calnav"; nxt.textContent = "›";
    nxt.onclick = e=>{ e.stopPropagation(); calView.m++; if(calView.m>11){calView.m=0; calView.y++;} draw(); };
    const title = document.createElement("b"); title.textContent = L().monF[calView.m]+" "+calView.y;
    head.append(prev, title, nxt); wrap.appendChild(head);

    const grid = document.createElement("div"); grid.className = "calgrid";
    for(const w of L().dow){ const c=document.createElement("div"); c.className="caldow"; c.textContent=w; grid.appendChild(c); }
    const first = new Date(calView.y, calView.m, 1);
    const lead = (first.getDay()+6)%7;               // неделя с понедельника
    for(let i=0;i<lead;i++) grid.appendChild(document.createElement("div"));
    const dim = new Date(calView.y, calView.m+1, 0).getDate();
    const from = fromIso(A.date_from), to = fromIso(A.date_to), one = fromIso(A.movein_date);
    for(let d=1; d<=dim; d++){
      const cell = new Date(calView.y, calView.m, d); cell.setHours(0,0,0,0);
      const el = document.createElement("div"); el.className = "calday"; el.textContent = d;
      if(cell.getTime()===t.getTime()) el.classList.add("today");
      if(cell < t){ el.classList.add("mut"); grid.appendChild(el); continue; }
      if(mode==="single"){
        if(one && cell.getTime()===one.getTime()) el.classList.add("sel");
        el.onclick = e=>{ e.stopPropagation(); A.movein_date=isoOf(cell); A.movein="date";
                          tg?.HapticFeedback?.selectionChanged(); refresh(); draw(); };
      } else {
        if(from && cell.getTime()===from.getTime()) el.classList.add("sel");
        if(to && cell.getTime()===to.getTime()) el.classList.add("sel");
        if(from && to && cell>from && cell<to) el.classList.add("rng");
        el.onclick = e=>{ e.stopPropagation();
          if(!A.date_from || (A.date_from && A.date_to)){ A.date_from=isoOf(cell); A.date_to=""; }
          else if(cell > from){ A.date_to=isoOf(cell); }
          else { A.date_from=isoOf(cell); A.date_to=""; }
          tg?.HapticFeedback?.selectionChanged(); refresh(); draw(); };
      }
      grid.appendChild(el);
    }
    wrap.appendChild(grid);

    const note = document.createElement("div"); note.className = "calnote";
    if(mode==="range"){
      const n = nights(A.date_from, A.date_to);
      note.innerHTML = (A.date_from && A.date_to)
        ? dShort(A.date_from)+" – "+dShort(A.date_to)+" · <b>"+L().nights(n)+"</b>"
        : L().pick_dates;
    } else {
      note.innerHTML = A.movein_date ? "<b>"+dShort(A.movein_date)+"</b>" : L().pick_date;
    }
    wrap.appendChild(note);
  }
  draw();
  return wrap;
}

// ---------------------------------------- рендер: строки-сводки ----------
// Каждый параметр — одна строка «название → текущее значение»; тап
// раскрывает варианты под строкой. Вся анкета видна одним экраном.
let open = null;      // ключ раскрытой строки
let pvOpen = false;   // раскрыт ли текст запроса

function fieldOptions(f){
  if (f.districts){
    const names = A.lang==="ru" ? DISTRICTS_RU : DISTRICTS_UZ;
    return names.map((d,i)=>[String(i),d]).concat([["any",L().all]]);
  }
  if (f.budget) return BUDGET_CHIPS[A.deal] || BUDGET_CHIPS.rent;
  let o = typeof f.o === "function" ? f.o(A) : f.o;
  return o.map(([v,key])=>[v, f.raw ? key : (L().o[key] ?? key)]);
}

function isOn(f, val){
  if (f.floor) return (A.floor_pref||[]).includes(val) || (val==="any" && !(A.floor_pref||[]).length);
  return f.multi ? (A[f.k]||[]).includes(val) : A[f.k]===val;
}

function pick(f, val){
  if (f.floor){
    let cur = A.floor_pref || [];
    if (val==="any") cur = [];
    else cur = cur.includes(val) ? cur.filter(x=>x!==val) : cur.filter(x=>x!=="any").concat([val]);
    A.floor_pref = cur;
  } else if (f.multi){
    let cur = A[f.k] || [];
    if (val==="any") cur = ["any"];
    else {
      cur = cur.filter(x=>x!=="any");
      cur = cur.includes(val) ? cur.filter(x=>x!==val) : cur.concat([val]);
    }
    A[f.k] = cur;
  } else if (f.k==="movein"){
    A.movein = val;
    if (val!=="date") A.movein_date = "";   // быстрый вариант отменяет дату
    // «📅 Дата» оставляем строку открытой — снизу появится календарь
    if (val!=="date") open = null;
  } else {
    A[f.k] = val;
    if (f.k==="deal"){          // пресеты бюджета под тип сделки
      A.budget = {rent:"1200", daily:"80", buy:"120000"}[val] || "1200";
      if (val==="daily"){ A.movein_date=""; A.movein="flex"; }   // даты берём из календаря
      else { A.date_from=""; A.date_to=""; }                     // календарь — только посуточно
    }
    // одиночный выбор закрывает строку; «другой город» открывает поле ввода
    open = (f.k==="city" && val==="other") ? "city_other" : null;
  }
  calView = null;
  render();
}

function summary(f){
  const o = L().o;
  if (f.text) return (A[f.k]||"").trim() || "—";
  if (f.districts){
    const names = A.lang==="ru" ? DISTRICTS_RU : DISTRICTS_UZ;
    const ds = (A.districts||[]).filter(x=>x!=="any").map(i=>names[+i]);
    if (!ds.length) return L().all;
    return ds.length<=2 ? ds.join(", ") : ds.slice(0,2).join(", ")+" +"+(ds.length-2);
  }
  if (f.k==="rooms"){
    const r = (A.rooms||[]).filter(x=>x!=="any").sort().map(x=>x==="4"?"4+":x);
    return r.length ? r.join(", ") : L().any;
  }
  if (f.budget){
    const b = A.budget_max || A.budget;
    const unit = A.deal==="daily" ? L().day : A.deal==="buy" ? "" : L().mo;
    return b ? money(b)+unit : "—";
  }
  if (f.floor){
    const fp = A.floor_pref||[]; const parts = [];
    if (fp.includes("nf")) parts.push(L().nf_s);
    if (fp.includes("nl")) parts.push(L().nl_s);
    const lo = String(A.floor_min||"").trim(), hi = String(A.floor_max||"").trim();
    if (lo&&hi) parts.push(lo+"–"+hi);
    else if (lo) parts.push("≥ "+lo);
    else if (hi) parts.push("≤ "+hi);
    return parts.length ? parts.join(", ") : o.fl_any;
  }
  if (f.cal){                         // диапазон дат: «15–18 авг · 3 ночи»
    if (!A.date_from) return "—";
    if (!A.date_to)   return dShort(A.date_from)+" …";
    const a = fromIso(A.date_from), b = fromIso(A.date_to);
    const span = a.getMonth()===b.getMonth()          // тот же месяц → «15–18 авг»
      ? a.getDate()+"–"+b.getDate()+" "+L().monS[b.getMonth()]
      : dShort(A.date_from)+"–"+dShort(A.date_to);
    return span+" · "+L().nights(nights(A.date_from,A.date_to));
  }
  if (f.k==="movein" && A.movein==="date")   // конкретная дата заезда
    return A.movein_date ? dShort(A.movein_date) : o.pick;
  const opts = typeof f.o==="function" ? f.o(A) : f.o;
  const m = (opts||[]).find(x=>x[0]===A[f.k]);
  return m ? (f.raw ? m[1] : (o[m[1]] ?? m[1])) : "—";
}

function refresh(){   // лёгкое обновление без пересборки DOM — не сбивает фокус ввода
  document.querySelectorAll(".rvv").forEach(el=>{
    const f = FIELDS.find(x=>x.k===el.dataset.k);
    if (f) el.textContent = summary(f);
  });
  preview();
}

function render(){
  const seg = document.getElementById("langseg");
  seg.innerHTML = "";
  for (const [code,label] of [["ru","RU"],["uz","UZ"],["en","EN"]]){
    const b = document.createElement("div");
    b.className = A.lang===code ? "on" : "";
    b.textContent = label;
    b.onclick = ()=>{ A.lang=code; tg?.HapticFeedback?.selectionChanged(); render(); };
    seg.appendChild(b);
  }
  document.getElementById("title").textContent = L().title;
  document.getElementById("lead").textContent = L().lead;
  document.getElementById("pv-title").textContent = L().pv;
  document.getElementById("fallback").textContent = L().submit;
  tg?.MainButton?.setText(L().submit);

  const root = document.getElementById("form");
  root.innerHTML = "";
  for (const f of FIELDS){
    if (f.when && !f.when(A)) continue;
    const key = f.floor ? "floor" : f.k;
    const r = document.createElement("div");
    r.className = "rowi" + (open===f.k ? " open" : "");
    const rl = document.createElement("span");
    rl.className = "rl"; rl.textContent = L().q[key];
    const rv = document.createElement("span"); rv.className = "rv";
    const rvv = document.createElement("span");
    rvv.className = "rvv"; rvv.dataset.k = f.k; rvv.textContent = summary(f);
    const ch = document.createElement("span"); ch.className = "chev"; ch.textContent = "›";
    rv.append(rvv, ch); r.append(rl, rv);
    r.onclick = ()=>{ open = open===f.k ? null : f.k; calView = null;
                      tg?.HapticFeedback?.selectionChanged(); render(); };
    root.appendChild(r);
    if (open !== f.k) continue;

    const ex = document.createElement("div");
    ex.className = "exp";
    ex.onclick = ev=>ev.stopPropagation();
    if (f.text){
      const row = document.createElement("div"); row.className = "row";
      const inp = document.createElement("input");
      inp.type = "text"; inp.value = A[f.k]||"";
      inp.oninput = e=>{ A[f.k]=e.target.value; refresh(); };
      row.appendChild(inp); ex.appendChild(row);
      root.appendChild(ex);
      setTimeout(()=>inp.focus(), 50);
      continue;
    }
    if (f.cal){                       // посуточно: сразу календарь-диапазон
      ex.appendChild(buildCalendar("range"));
      root.appendChild(ex);
      continue;
    }
    const box = document.createElement("div");
    box.className = "chips grid" + (f.cols || 2);
    const opts = f.floor
      ? [["nf",L().o.nf],["nl",L().o.nl],["any",L().o.fl_any]]
      : fieldOptions(f);
    for (const [val,text] of opts){
      const b = document.createElement("div");
      b.className = "chip" + (isOn(f,val) ? " on" : "");
      b.textContent = text;
      b.onclick = ev=>{ ev.stopPropagation(); pick(f,val);
                        tg?.HapticFeedback?.selectionChanged(); };
      box.appendChild(b);
    }
    ex.appendChild(box);
    if (f.budget){
      const row = document.createElement("div"); row.className = "row";
      const inp = document.createElement("input");
      inp.type = "number"; inp.inputMode = "numeric";
      inp.placeholder = L().exact; inp.value = A.budget_max||"";
      inp.oninput = e=>{ A.budget_max=e.target.value; refresh(); };
      row.appendChild(inp); ex.appendChild(row);
    }
    if (f.floor){
      const row = document.createElement("div"); row.className = "row";
      for (const [kk, ph] of [["floor_min",L().from],["floor_max",L().to]]){
        const inp = document.createElement("input");
        inp.type = "number"; inp.inputMode = "numeric";
        inp.placeholder = ph; inp.value = A[kk]||"";
        inp.oninput = e=>{ A[kk]=e.target.value; refresh(); };
        row.appendChild(inp);
      }
      ex.appendChild(row);
    }
    if (f.calopt && A.movein==="date")   // «📅 Дата» → одиночный календарь под чипами
      ex.appendChild(buildCalendar("single"));
    root.appendChild(ex);
  }
  preview();
}

// -------------------------------------------- предпросмотр письма --------
// Письмо маклеру — всегда по-русски или по-узбекски: английский они не читают.
// Итоговый текст всё равно собирает бот на сервере; здесь — живой предпросмотр.
function money(v){ return "$" + String(v).replace(/\B(?=(\d{3})+(?!\d))/g," "); }

function letter(){
  const uz = A.lang==="uz";
  const p = [];
  const OBJ = uz ? {flat:"kvartira",house:"hovli uy",dacha:"dala hovli",land:"yer uchastkasi"}
                 : {flat:"квартиру",house:"дом",dacha:"дачу",land:"участок"};
  const PLACE = uz ? {tashkent:"Toshkentda",charvak:"Chorvoq / Chimyonda",region:"Toshkent viloyatida"}
                   : {tashkent:"в Ташкенте",charvak:"на Чарваке / Чимгане",region:"в Ташкентской области"};
  let place = PLACE[A.city] || "";
  if (A.city==="other" && A.city_other.trim())
    place = uz ? A.city_other.trim()+" shahrida" : "в "+A.city_other.trim();
  if (uz){
    const verb = {rent:"ijaraga olmoqchiman",daily:"kunlik ijaraga olmoqchiman",buy:"sotib olmoqchiman"}[A.deal];
    p.push(`Assalomu alaykum! ${[place,OBJ[A.object],verb].filter(Boolean).join(" ")}.`);
  } else {
    const verb = {rent:"снять",daily:"снять посуточно",buy:"купить"}[A.deal];
    p.push(`Здравствуйте! Хочу ${verb} ${OBJ[A.object]}${place?" "+place:""}.`);
  }

  const req = [];
  if (A.object!=="land"){
    const rooms = (A.rooms||[]).filter(x=>x!=="any").sort();
    if (rooms.length) req.push((uz?"xonalar: ":"комнат: ") + rooms.join("–") + (rooms.includes("4")?"+":""));
  }
  if (A.city==="tashkent"){
    const names = uz ? DISTRICTS_UZ : DISTRICTS_RU;
    const ds = (A.districts||[]).filter(x=>x!=="any").map(i=>names[+i]);
    if (ds.length) req.push((uz?"tumanlar: ":"районы: ") + ds.join(", "));
  }
  const b = A.budget_max || A.budget;
  if (b){
    const unit = A.deal==="daily" ? (uz?" kuniga":"/сутки") : A.deal==="buy" ? "" : (uz?" oyiga":"/мес");
    req.push(uz ? `byudjet${unit} ${money(b)} gacha` : `бюджет до ${money(b)}${unit}`);
  }
  if (req.length) p.push((uz?"Parametrlar: ":"Параметры: ") + req.join("; ") + ".");

  const w = [];
  const CLS = uz ? {new:"yangi qurilgan uy yoki TJM bo'lsa yaxshi",
                    premium:"dizayner ta'miri bilan yangi TJM qiziqtiradi",
                    reno:"yaxshi ta'mirlangan ikkilamchi uy ham bo'ladi",
                    biz:"biznes / premium toifa qiziqtiradi"}
                 : {new:"желательно новостройка или ЖК",
                    premium:"интересует новый ЖК с хорошим (авторским) ремонтом",
                    reno:"рассмотрю вторичку с хорошим ремонтом",
                    biz:"интересует бизнес / премиум-класс"};
  if (A.object!=="land" && CLS[A.class]) w.push(CLS[A.class]);
  if (A.deal!=="buy"){
    if (A.furniture==="yes" && A.object!=="land") w.push(uz?"mebel va texnika bilan":"с мебелью и техникой");
    if (A.object==="flat"){
      const fp = A.floor_pref||[];
      if (fp.includes("nf")) w.push(uz?"birinchi qavat emas":"не первый этаж");
      if (fp.includes("nl")) w.push(uz?"oxirgi qavat emas":"не последний этаж");
      const lo=String(A.floor_min||"").trim(), hi=String(A.floor_max||"").trim();
      if (lo&&hi) w.push(uz?`qavat: ${lo}–${hi}`:`этаж ${lo}–${hi}`);
      else if (lo) w.push(uz?`${lo}-qavatdan yuqori`:`этаж от ${lo}`);
      else if (hi) w.push(uz?`${hi}-qavatgacha`:`этаж до ${hi}`);
    }
    if (A.deal==="rent"){          // срок аренды — только у длительной
      const TERM = uz ? {"12":"uzoq muddatga, 1 yildan","6_12":"6–12 oyga","3_6":"3–6 oyga"}
                      : {"12":"на длительный срок, от года","6_12":"на 6–12 месяцев","3_6":"на 3–6 месяцев"};
      if (TERM[A.term]) w.push(TERM[A.term]);
    }
    const WHO = uz ? {single:"bir kishi uchun",couple:"juftlik uchun",family_kids:"bolali oila uchun",
                      family:"bolasiz oila uchun",big:"katta oila uchun",group:"do'stlar uchun"}
                   : {single:"для одного",couple:"для пары",family_kids:"для семьи с детьми",
                      family:"для семьи без детей",big:"для большой семьи",group:"для друзей / коллег"};
    if (WHO[A.who]) w.push(WHO[A.who]);
    const PETS = uz ? {cat:"mushuk bilan",dog:"it bilan",pet_other:"uy hayvoni bilan"}
                    : {cat:"с кошкой",dog:"с собакой",pet_other:"с домашним животным"};
    if (PETS[A.pets]) w.push(PETS[A.pets]);
  }
  if (A.parking==="yes") w.push(uz?"avtoturargoh kerak":"нужна парковка");
  if (w.length) p.push((uz?"Xohishlar: ":"Пожелания: ") + w.join(", ") + ".");

  if (A.deal==="daily" && A.date_from && A.date_to){        // посуточно — конкретные даты
    const n = nights(A.date_from, A.date_to);
    const nl = uz ? n+" kecha" : L().nights(n);
    p.push(uz
      ? `Sanalar: ${dLong(A.date_from,"uz")}dan ${dLong(A.date_to,"uz")}gacha — ${nl}.`
      : `Даты: заезд ${dLong(A.date_from,"ru")}, выезд ${dLong(A.date_to,"ru")} — ${nl}.`);
  } else if (A.deal==="rent"){
    if (A.movein==="date" && A.movein_date){               // длительная — точная дата заезда
      p.push(uz ? `${dLong(A.movein_date,"uz")}dan kirishni rejalashtiryapman.`
                : `Заезд планирую с ${dLong(A.movein_date,"ru")}.`);
    } else {
      const MV = uz ? {now:"Darhol kirishga tayyorman.",month:"Bir oy ichida kiraman.",
                       flex:"Muddat bo'yicha moslashuvchanman."}
                    : {now:"Готов заехать сразу.",month:"Заезд в течение месяца.",flex:"По срокам гибко."};
      if (MV[A.movein]) p.push(MV[A.movein]);
    }
  }

  p.push(A.object==="flat"       // этаж уместен только для квартиры
    ? (uz ? "Mos variant bo'lsa — foto, aniq manzil, qavati, maydoni va narxini yuboring. Vositachilik haqini ham yozing."
          : "Если есть подходящие варианты — пришлите, пожалуйста, фото, точный адрес, этаж, площадь и цену. Сразу уточните размер комиссии.")
    : (uz ? "Mos variant bo'lsa — foto, aniq manzil, maydoni va narxini yuboring. Vositachilik haqini ham yozing."
          : "Если есть подходящие варианты — пришлите, пожалуйста, фото, точный адрес, площадь и цену. Сразу уточните размер комиссии."));

  const link = `https://t.me/${A._bot || "rano_smart_bot"}`;
  if (A.contact==="bot" || A.contact==="both")
    p.push(uz ? `Variantlarni yordamchim Ranoga yuboring: ${link}\nHavolani bosib yozing — u menga darhol yetkazadi.`
              : `Варианты присылайте, пожалуйста, моей помощнице — Рано: ${link}\nНажмите на ссылку и напишите ей, она сразу передаёт мне.`);
  p.push(uz ? "Rahmat!" : "Спасибо!");
  return p.join("\n");
}

function preview(){
  document.getElementById("preview").textContent = letter();
  document.getElementById("pv-hint").textContent =
    L().pv_hint + (A.lang==="en" ? " " + L().pv_hint_en : "");
  document.getElementById("pv-box").style.display = pvOpen ? "" : "none";
  document.getElementById("pv-row").classList.toggle("open", pvOpen);
}
document.getElementById("pv-row").onclick = ()=>{
  pvOpen = !pvOpen; tg?.HapticFeedback?.selectionChanged(); preview();
};

function submit(){
  const payload = JSON.stringify({v: 2, ans: A});
  tg?.HapticFeedback?.notificationOccurred("success");
  if (tg?.sendData) tg.sendData(payload);
  else alert(A.lang==="en" ? "Open this page from the bot button"
            : A.lang==="uz" ? "Sahifani botdagi tugma orqali oching"
            : "Откройте страницу через кнопку в боте");
}

if (tg){
  tg.ready();
  tg.expand();
  tg.MainButton.show();
  tg.MainButton.onClick(submit);
} else {
  const b = document.getElementById("fallback");
  b.style.display = "block";
  b.onclick = submit;
}
render();
</script>
