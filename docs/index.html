<style>
  :root{
    --bg:#FCF5F1; --card:#FFFFFF; --ink:#2B1D22; --muted:#9A828A;
    --line:#F1E5DF; --accent:#C21F45; --accent-weak:rgba(194,31,69,.085);
    --accent-ink:#FFFFFF; --gold:#C69A3E;
    --shadow:0 1px 2px rgba(90,30,45,.05), 0 7px 22px rgba(90,30,45,.06);
    --bloom:linear-gradient(140deg,#E64B6A 0%,#C21F45 48%,#C69A3E 118%);
  }
  body.dark{
    --bg:#16100F; --card:#221619; --ink:#F3E7E9; --muted:#A88E95;
    --line:#33232A; --accent:#E24A69; --accent-weak:rgba(226,74,105,.16);
    --gold:#D4AC55;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 0 calc(94px + env(safe-area-inset-bottom))}
  .disp{font-family:"Fraunces","Times New Roman",Georgia,serif;letter-spacing:-.005em}

  .hero{position:relative;padding:16px 16px 12px;overflow:hidden}
  .hero .glow{position:absolute;top:-70px;right:-50px;width:190px;height:190px;
    background:var(--bloom);filter:blur(46px);opacity:.26;border-radius:50%;pointer-events:none}
  .hrow{display:flex;align-items:center;gap:11px;position:relative}
  .mono{width:42px;height:42px;border-radius:14px;background:var(--bloom);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 14px rgba(194,31,69,.34)}
  .mono svg{width:25px;height:25px}
  .hname{font-size:18px;font-weight:800;line-height:1.05}
  .hsub{font-size:12px;color:var(--muted);margin-top:2px}
  .seg{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);
    border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
  .seg div{padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg div.on{background:var(--accent);color:var(--accent-ink)}
  .brief{position:relative;margin:15px 4px 2px;font-size:16.5px;line-height:1.34;font-weight:700}
  .brief .hl{color:var(--accent)}
  .meter{position:relative;margin:12px 4px 2px;display:flex;align-items:center;gap:10px}
  .meter .bar{flex:1;height:6px;border-radius:6px;background:var(--accent-weak);overflow:hidden}
  .meter .fill{height:100%;background:var(--bloom);border-radius:6px;transition:width .35s ease}
  .meter .lab{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}

  .wrap{padding:8px 12px 0}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:16px 16px 4px;margin-bottom:13px;box-shadow:var(--shadow)}
  .sechd{display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .sechd .ic{width:27px;height:27px;border-radius:9px;background:var(--accent-weak);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .sechd .ic svg{width:15px;height:15px}
  .sechd b{font-size:14.5px;font-weight:800;letter-spacing:.005em}
  .field{margin-bottom:15px}
  .flabel{font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);
    border-radius:11px;padding:9px 14px;font-size:13.5px;font-weight:500;cursor:pointer;
    min-height:42px;display:flex;align-items:center;transition:transform .06s ease,border-color .12s,background .12s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .grid3 .chip{flex:1 1 calc(33.333% - 5px);justify-content:center;text-align:center}
  .grid2 .chip{flex:1 1 calc(50% - 4px);justify-content:center;text-align:center}
  .row{display:flex;gap:8px;margin-top:9px}
  input[type=number],input[type=text]{flex:1;background:var(--bg);color:var(--ink);
    border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;font-size:16px;min-width:0}
  input:focus{outline:none;border-color:var(--accent)}

  .cal{padding-top:4px}
  .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .calhead b{font-size:14.5px;font-weight:700}
  .calnav{width:34px;height:34px;border:1.5px solid var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
  .calnav:active{transform:scale(.93)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .caldow{text-align:center;font-size:11px;color:var(--muted);padding:1px 0 3px}
  .calday{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13.5px;
    border-radius:10px;cursor:pointer;user-select:none;color:var(--ink)}
  .calday.mut{opacity:.28;cursor:default}
  .calday.rng{background:var(--accent-weak);border-radius:0}
  .calday.sel{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px}
  .calday.today:not(.sel){box-shadow:inset 0 0 0 1.5px var(--accent)}
  .calnote{color:var(--muted);font-size:12.5px;margin-top:9px;text-align:center}
  .calnote b{color:var(--accent)}

  .pv{background:var(--card);border:1px solid var(--line);border-radius:20px;
    margin:2px 12px 14px;box-shadow:var(--shadow);overflow:hidden}
  .pvhd{display:flex;align-items:center;gap:9px;padding:15px 16px;cursor:pointer}
  .pvhd .ic{width:27px;height:27px;border-radius:9px;background:var(--accent-weak);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .pvhd .ic svg{width:15px;height:15px}
  .pvhd b{font-size:14.5px;font-weight:800}
  .pvhd .chev{margin-left:auto;color:var(--muted);font-size:18px;transition:transform .15s ease}
  .pv.open .pvhd .chev{transform:rotate(90deg)}
  .pvbody{padding:0 16px 16px}
  .preview{background:var(--bg);border:1px solid var(--line);border-radius:13px;
    padding:13px;font-size:13.5px;white-space:pre-wrap;color:var(--ink);max-height:260px;overflow:auto}
  .muted{color:var(--muted);font-size:12.5px;margin-top:8px}

  .fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--accent);color:var(--accent-ink);border:0;border-radius:15px;padding:16px;
    font-size:16px;font-weight:700;width:calc(100% - 24px);display:none;
    box-shadow:0 8px 20px rgba(194,31,69,.34)}
</style>
</head>

</div>

if (!location.hash && (nav === "uz" || nav === "en")) A.lang = nav;

const L = () => T[A.lang] || T.ru;

// ------------------------------------------------- даты и календарь ------
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+
                          "-"+String(d.getDate()).padStart(2,"0"); }
function fromIso(s){ if(!s) return null; const p=String(s).split("-").map(Number);
  if(p.length!==3||!p[0]) return null; const d=new Date(p[0],p[1]-1,p[2]); d.setHours(0,0,0,0); return d; }
function nights(a,b){ const x=fromIso(a), y=fromIso(b);
  return x&&y ? Math.round((y-x)/86400000) : 0; }
// «15 авг» — для сводки; «15 августа» / «15-avgust» / «August 15» — для письма
function dShort(iso){ const d=fromIso(iso); return d ? d.getDate()+" "+L().monS[d.getMonth()] : ""; }
function dLong(iso, lang){ const d=fromIso(iso); if(!d) return "";
  const t=T[lang]||T.ru, day=d.getDate(), m=d.getMonth();
  if(lang==="uz") return day+"-"+t.monG[m];
  if(lang==="en") return t.monG[m]+" "+day;
  return day+" "+t.monG[m]; }

let calView = null;   // {y,m} показанный месяц (сбрасывается при закрытии строки)

function buildCalendar(mode){   // mode: "range" (date_from/date_to) | "single" (movein_date)
  const wrap = document.createElement("div"); wrap.className = "cal";
  const t = today0();
  if(!calView){
    const base = fromIso(mode==="range" ? A.date_from : A.movein_date) || t;
    calView = {y:base.getFullYear(), m:base.getMonth()};
  }
  function draw(){
    wrap.innerHTML = "";
    const head = document.createElement("div"); head.className = "calhead";
    const prev = document.createElement("div"); prev.className = "calnav"; prev.textContent = "‹";
    prev.onclick = e=>{ e.stopPropagation();
      if(calView.y>t.getFullYear() || calView.m>t.getMonth() || calView.y>t.getFullYear()){
        calView.m--; if(calView.m<0){calView.m=11; calView.y--;} draw();
      }};
    // не листаем в прошлое дальше текущего месяца
    const canPrev = (calView.y>t.getFullYear()) || (calView.y===t.getFullYear() && calView.m>t.getMonth());
    if(!canPrev) prev.style.opacity = ".3";
    const nxt = document.createElement("div"); nxt.className = "calnav"; nxt.textContent = "›";
    nxt.onclick = e=>{ e.stopPropagation(); calView.m++; if(calView.m>11){calView.m=0; calView.y++;} draw(); };
    const title = document.createElement("b"); title.textContent = L().monF[calView.m]+" "+calView.y;
    head.append(prev, title, nxt); wrap.appendChild(head);

    const grid = document.createElement("div"); grid.className = "calgrid";
    for(const w of L().dow){ const c=document.createElement("div"); c.className="caldow"; c.textContent=w; grid.appendChild(c); }
    const first = new Date(calView.y, calView.m, 1);
    const lead = (first.getDay()+6)%7;               // неделя с понедельника
    for(let i=0;i<lead;i++) grid.appendChild(document.createElement("div"));
    const dim = new Date(calView.y, calView.m+1, 0).getDate();
    const from = fromIso(A.date_from), to = fromIso(A.date_to), one = fromIso(A.movein_date);
    for(let d=1; d<=dim; d++){
      const cell = new Date(calView.y, calView.m, d); cell.setHours(0,0,0,0);
      const el = document.createElement("div"); el.className = "calday"; el.textContent = d;
      if(cell.getTime()===t.getTime()) el.classList.add("today");
      if(cell < t){ el.classList.add("mut"); grid.appendChild(el); continue; }
      if(mode==="single"){
        if(one && cell.getTime()===one.getTime()) el.classList.add("sel");
        el.onclick = e=>{ e.stopPropagation(); A.movein_date=isoOf(cell); A.movein="date";
                          tg?.HapticFeedback?.selectionChanged(); refresh(); draw(); };
      } else {
        if(from && cell.getTime()===from.getTime()) el.classList.add("sel");
        if(to && cell.getTime()===to.getTime()) el.classList.add("sel");
        if(from && to && cell>from && cell<to) el.classList.add("rng");
        el.onclick = e=>{ e.stopPropagation();
          if(!A.date_from || (A.date_from && A.date_to)){ A.date_from=isoOf(cell); A.date_to=""; }
          else if(cell > from){ A.date_to=isoOf(cell); }
          else { A.date_from=isoOf(cell); A.date_to=""; }
          tg?.HapticFeedback?.selectionChanged(); refresh(); draw(); };
      }
      grid.appendChild(el);
    }
    wrap.appendChild(grid);

    const note = document.createElement("div"); note.className = "calnote";
    if(mode==="range"){
      const n = nights(A.date_from, A.date_to);
      note.innerHTML = (A.date_from && A.date_to)
        ? dShort(A.date_from)+" – "+dShort(A.date_to)+" · <b>"+L().nights(n)+"</b>"
        : L().pick_dates;
    } else {
      note.innerHTML = A.movein_date ? "<b>"+dShort(A.movein_date)+"</b>" : L().pick_date;
    }
    wrap.appendChild(note);
  }
  draw();
  return wrap;
}

// ----------------------------------------- рендер: блоки и чипы ----------
// Всё на одном экране: параметры сгруппированы в карточки-разделы, варианты —
// всегда открытые чипы (без раскрытия строк). Вверху — живой «бриф».
let pvOpen = false;        // calView объявлен выше, в блоке календаря

function fieldOptions(f){
  if (f.districts){
    const names = A.lang==="ru" ? DISTRICTS_RU : DISTRICTS_UZ;
    return names.map((d,i)=>[String(i),d]).concat([["any",L().all]]);
  }
  if (f.budget) return BUDGET_CHIPS[A.deal] || BUDGET_CHIPS.rent;
  let o = typeof f.o === "function" ? f.o(A) : f.o;
  return o.map(([v,key])=>[v, v==="any" ? L().any : (f.raw ? key : (L().o[key] ?? key))]);
}

function isOn(f, val){
  if (f.floor) return (A.floor_pref||[]).includes(val) || (val==="any" && !(A.floor_pref||[]).length);
  return f.multi ? (A[f.k]||[]).includes(val) : A[f.k]===val;
}

function pick(f, val){
  if (f.floor){
    let cur = A.floor_pref || [];
    if (val==="any") cur = [];
    else cur = cur.includes(val) ? cur.filter(x=>x!==val) : cur.filter(x=>x!=="any").concat([val]);
    A.floor_pref = cur;
  } else if (f.multi){
    let cur = A[f.k] || [];
    if (val==="any") cur = ["any"];
    else { cur = cur.filter(x=>x!=="any");
           cur = cur.includes(val) ? cur.filter(x=>x!==val) : cur.concat([val]); }
    A[f.k] = cur;
  } else if (f.k==="movein"){
    A.movein = val; if (val!=="date") A.movein_date = "";
  } else {
    A[f.k] = val;
    if (f.k==="deal"){                       // пресеты под тип сделки
      A.budget = {rent:"1200", daily:"80", buy:"120000"}[val] || "1200";
      calView = null;
      if (val==="daily"){ A.movein_date=""; A.movein="flex"; }
      else { A.date_from=""; A.date_to=""; }
    }
    if (f.k==="city" && val!=="other") A.city_other = "";
  }
  tg?.HapticFeedback?.selectionChanged();
  render();
}

// 14 параметров сгруппированы по смыслу в 4 раздела

};
const SEC_FIELDS = {
  where:["deal","object","city","city_other","districts"],
  home:["rooms","budget","class","floor","furniture"],
  when:["dates","term","movein","who","pets","parking"],

};
const ICON = {

  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 9v11h14V9"/><path d="M9.5 20v-6h5v6"/></svg>',

};

function esc(x){ return String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// живой «бриф» — параметры складываются в человеческую фразу
function brief(){
  const uz=A.lang==="uz", en=A.lang==="en";
  const OBJ = uz?{flat:"kvartira",house:"hovli uy",dacha:"dala hovli",land:"yer"}
            : en?{flat:"apartment",house:"house",dacha:"country house",land:"land plot"}
            : {flat:"квартиру",house:"дом",dacha:"дачу",land:"участок"};
  const segs=[];
  let objp = '<span class="hl">'+OBJ[A.object]+'</span>';
  if (A.object!=="land"){
    const r=(A.rooms||[]).filter(x=>x!=="any").sort().map(x=>x==="4"?"4+":x);
    if (r.length) objp = r.join("–")+(uz?"-xonali ":en?"-room ":"-комн. ")+objp;
  }
  segs.push(objp);
  let loc="";
  if (A.city==="tashkent"){
    const names=(uz||en)?DISTRICTS_UZ:DISTRICTS_RU;   // латиница для uz и en
    const ds=(A.districts||[]).filter(x=>x!=="any").map(i=>names[+i]);
    loc = ds.length ? (ds.length<=2?ds.join(", "):ds.slice(0,2).join(", ")+" +"+(ds.length-2)) : "";
  } else if (A.city==="other"){ loc=(A.city_other||"").trim(); }
  else { loc=(uz?{charvak:"Chorvoq",region:"Toshkent vil."}:en?{charvak:"Charvak",region:"Tashkent reg."}
             :{charvak:"Чарвак",region:"Ташк. обл."})[A.city]||""; }
  if (loc) segs.push(esc(loc));
  if (A.deal==="daily" && A.date_from && A.date_to){
    const a=fromIso(A.date_from), b=fromIso(A.date_to);
    segs.push(a.getMonth()===b.getMonth()? a.getDate()+"–"+b.getDate()+" "+L().monS[b.getMonth()]
             : dShort(A.date_from)+"–"+dShort(A.date_to));
  }
  const bud=A.budget_max||A.budget;
  if (bud){
    const unit=A.deal==="daily"?L().day:A.deal==="buy"?"":L().mo;
    const txt = uz?(money(bud)+unit+" gacha"):en?(money(bud)+unit):("до "+money(bud)+unit);
    segs.push('<span class="hl">'+txt+'</span>');
  }
  const pre = uz?"Ra'no qidiryapti:":en?"Ra'no is looking for:":"Ra'no ищет:";
  return pre+" "+segs.join(" · ");
}

// «точность запроса»: чем детальнее, тем легче маклеру подобрать. Положительная
// рамка (эффект градиента цели), а не «заполните обязательные поля».
function completeness(){
  let s=0; const N=5;
  if (A.object==="land" || (A.rooms||[]).filter(x=>x!=="any").length) s++;
  if (A.city!=="tashkent" || (A.districts||[]).filter(x=>x!=="any").length) s++;
  if (A.object==="land" || (A.class && A.class!=="any")) s++;
  if (A.deal==="buy" || (A.deal==="daily" ? (A.date_from&&A.date_to)
                                          : (A.movein!=="flex"||A.term!=="12"||A.movein_date))) s++;
  if ((A.floor_pref||[]).length||A.floor_min||A.floor_max||A.furniture!=="any"
      ||A.who!=="single"||A.parking==="yes"||A.pets!=="no") s++;
  const pct=Math.max(15, Math.round(s/N*100));
  const lab = pct>=80 ? (A.lang==="uz"?"Aniq so'rov":A.lang==="en"?"Precise brief":"Точный запрос")
            : pct>=45 ? (A.lang==="uz"?"Yaxshi so'rov":A.lang==="en"?"Good brief":"Хороший запрос")
            :           (A.lang==="uz"?"Asosiy so'rov":A.lang==="en"?"Basic brief":"Базовый запрос");
  return {pct, lab};
}

function refresh(){          // лёгкое обновление брифа и текста запроса (не сбивает фокус ввода)
  const bl=document.getElementById("brief"); if(bl) bl.innerHTML=brief();
  const c=completeness();
  const mf=document.getElementById("mfill"); if(mf) mf.style.width=c.pct+"%";
  const ml=document.getElementById("mlab"); if(ml) ml.textContent=c.lab;
  const pv=document.getElementById("preview"); if(pv) pv.textContent=letter();
  const ph=document.getElementById("pv-hint");
  if(ph) ph.textContent=L().pv_hint+(A.lang==="en"?" "+L().pv_hint_en:"");
}

function control(f){
  const wrap=document.createElement("div"); wrap.className="field";
  const lab=document.createElement("div"); lab.className="flabel";
  lab.textContent=L().q[f.floor?"floor":f.k]; wrap.appendChild(lab);
  if (f.text){
    const row=document.createElement("div"); row.className="row"; row.style.marginTop="0";
    const inp=document.createElement("input"); inp.type="text"; inp.value=A[f.k]||"";
    inp.oninput=e=>{ A[f.k]=e.target.value; refresh(); };
    row.appendChild(inp); wrap.appendChild(row); return wrap;
  }
  if (f.cal){ wrap.appendChild(buildCalendar("range")); return wrap; }
  const box=document.createElement("div"); box.className="chips grid"+(f.cols||2);
  const opts = f.floor?[["nf",L().o.nf],["nl",L().o.nl],["any",L().o.fl_any]]:fieldOptions(f);
  for (const [val,text] of opts){
    const b=document.createElement("div"); b.className="chip"+(isOn(f,val)?" on":"");
    b.textContent=text; b.onclick=()=>pick(f,val); box.appendChild(b);
  }
  wrap.appendChild(box);
  if (f.budget){
    const row=document.createElement("div"); row.className="row";
    const inp=document.createElement("input"); inp.type="number"; inp.inputMode="numeric";
    inp.placeholder=L().exact; inp.value=A.budget_max||"";
    inp.oninput=e=>{ A.budget_max=e.target.value; refresh(); };
    row.appendChild(inp); wrap.appendChild(row);
  }
  if (f.floor){
    const row=document.createElement("div"); row.className="row";
    for (const [kk,ph] of [["floor_min",L().from],["floor_max",L().to]]){
      const inp=document.createElement("input"); inp.type="number"; inp.inputMode="numeric";
      inp.placeholder=ph; inp.value=A[kk]||""; inp.oninput=e=>{ A[kk]=e.target.value; refresh(); };
      row.appendChild(inp);
    }
    wrap.appendChild(row);
  }
  if (f.calopt && A.movein==="date") wrap.appendChild(buildCalendar("single"));
  return wrap;
}

function render(){
  document.getElementById("hname").textContent = "Ra'no";
  document.getElementById("hsub").textContent = L().title;
  const seg=document.getElementById("seg"); seg.innerHTML="";
  for (const [c,l] of [["ru","RU"],["uz","UZ"],["en","EN"]]){
    const d=document.createElement("div"); d.className=A.lang===c?"on":""; d.textContent=l;
    d.onclick=()=>{ A.lang=c; tg?.HapticFeedback?.selectionChanged(); render(); };
    seg.appendChild(d);
  }
  document.getElementById("pv-title").textContent=L().pv;
  const fab=document.getElementById("fab"); if(fab) fab.textContent=L().submit;
  tg?.MainButton?.setText(L().submit);

  const wrap=document.getElementById("wrap"); wrap.innerHTML="";
  for (const [key,title] of (SEC[A.lang]||SEC.ru)){
    const fields = SEC_FIELDS[key].map(k=>FIELDS.find(f=>f.k===k))
                   .filter(f=>f && (!f.when || f.when(A)));
    if (!fields.length) continue;
    const sec=document.createElement("div"); sec.className="sec";
    const hd=document.createElement("div"); hd.className="sechd";
    const ic=document.createElement("span"); ic.className="ic"; ic.innerHTML=ICON[key];
    const b=document.createElement("b"); b.textContent=title;
    hd.append(ic,b); sec.appendChild(hd);
    for (const f of fields) sec.appendChild(control(f));
    wrap.appendChild(sec);
  }
  refresh();
}

// -------------------------------------------- предпросмотр письма --------
// Письмо маклеру — всегда по-русски или по-узбекски: английский они не читают.
// Итоговый текст всё равно собирает бот на сервере; здесь — живой предпросмотр.
function money(v){ return "$" + String(v).replace(/\B(?=(\d{3})+(?!\d))/g," "); }

function letter(){
  const uz = A.lang==="uz";
  const p = [];
  const OBJ = uz ? {flat:"kvartira",house:"hovli uy",dacha:"dala hovli",land:"yer uchastkasi"}
                 : {flat:"квартиру",house:"дом",dacha:"дачу",land:"участок"};
  const PLACE = uz ? {tashkent:"Toshkentda",charvak:"Chorvoq / Chimyonda",region:"Toshkent viloyatida"}
                   : {tashkent:"в Ташкенте",charvak:"на Чарваке / Чимгане",region:"в Ташкентской области"};
  let place = PLACE[A.city] || "";
  if (A.city==="other" && A.city_other.trim())
    place = uz ? A.city_other.trim()+" shahrida" : "в "+A.city_other.trim();
  if (uz){
    const verb = {rent:"ijaraga olmoqchiman",daily:"kunlik ijaraga olmoqchiman",buy:"sotib olmoqchiman"}[A.deal];
    p.push(`Assalomu alaykum! ${[place,OBJ[A.object],verb].filter(Boolean).join(" ")}.`);
  } else {
    const verb = {rent:"снять",daily:"снять посуточно",buy:"купить"}[A.deal];
    p.push(`Здравствуйте! Хочу ${verb} ${OBJ[A.object]}${place?" "+place:""}.`);
  }

  const req = [];
  if (A.object!=="land"){
    const rooms = (A.rooms||[]).filter(x=>x!=="any").sort();
    if (rooms.length) req.push((uz?"xonalar: ":"комнат: ") + rooms.join("–") + (rooms.includes("4")?"+":""));
  }
  if (A.city==="tashkent"){
    const names = uz ? DISTRICTS_UZ : DISTRICTS_RU;
    const ds = (A.districts||[]).filter(x=>x!=="any").map(i=>names[+i]);
    if (ds.length) req.push((uz?"tumanlar: ":"районы: ") + ds.join(", "));
  }
  const b = A.budget_max || A.budget;
  if (b){
    const unit = A.deal==="daily" ? (uz?" kuniga":"/сутки") : A.deal==="buy" ? "" : (uz?" oyiga":"/мес");
    req.push(uz ? `byudjet${unit} ${money(b)} gacha` : `бюджет до ${money(b)}${unit}`);
  }
  if (req.length) p.push((uz?"Parametrlar: ":"Параметры: ") + req.join("; ") + ".");

  const w = [];
  const CLS = uz ? {new:"yangi qurilgan uy yoki TJM bo'lsa yaxshi",
                    premium:"dizayner ta'miri bilan yangi TJM qiziqtiradi",
                    reno:"yaxshi ta'mirlangan ikkilamchi uy ham bo'ladi",
                    biz:"biznes / premium toifa qiziqtiradi"}
                 : {new:"желательно новостройка или ЖК",
                    premium:"интересует новый ЖК с хорошим (авторским) ремонтом",
                    reno:"рассмотрю вторичку с хорошим ремонтом",
                    biz:"интересует бизнес / премиум-класс"};
  if (A.object!=="land" && CLS[A.class]) w.push(CLS[A.class]);
  if (A.deal!=="buy"){
    if (A.furniture==="yes" && A.object!=="land") w.push(uz?"mebel va texnika bilan":"с мебелью и техникой");
    if (A.object==="flat"){
      const fp = A.floor_pref||[];
      if (fp.includes("nf")) w.push(uz?"birinchi qavat emas":"не первый этаж");
      if (fp.includes("nl")) w.push(uz?"oxirgi qavat emas":"не последний этаж");
      const lo=String(A.floor_min||"").trim(), hi=String(A.floor_max||"").trim();
      if (lo&&hi) w.push(uz?`qavat: ${lo}–${hi}`:`этаж ${lo}–${hi}`);
      else if (lo) w.push(uz?`${lo}-qavatdan yuqori`:`этаж от ${lo}`);
      else if (hi) w.push(uz?`${hi}-qavatgacha`:`этаж до ${hi}`);
    }
    if (A.deal==="rent"){          // срок аренды — только у длительной
      const TERM = uz ? {"12":"uzoq muddatga, 1 yildan","6_12":"6–12 oyga","3_6":"3–6 oyga"}
                      : {"12":"на длительный срок, от года","6_12":"на 6–12 месяцев","3_6":"на 3–6 месяцев"};
      if (TERM[A.term]) w.push(TERM[A.term]);
    }
    const WHO = uz ? {single:"bir kishi uchun",couple:"juftlik uchun",family_kids:"bolali oila uchun",
                      family:"bolasiz oila uchun",big:"katta oila uchun",group:"do'stlar uchun"}
                   : {single:"для одного",couple:"для пары",family_kids:"для семьи с детьми",
                      family:"для семьи без детей",big:"для большой семьи",group:"для друзей / коллег"};
    if (WHO[A.who]) w.push(WHO[A.who]);
    const PETS = uz ? {cat:"mushuk bilan",dog:"it bilan",pet_other:"uy hayvoni bilan"}
                    : {cat:"с кошкой",dog:"с собакой",pet_other:"с домашним животным"};
    if (PETS[A.pets]) w.push(PETS[A.pets]);
  }
  if (A.parking==="yes") w.push(uz?"avtoturargoh kerak":"нужна парковка");
  if (w.length) p.push((uz?"Xohishlar: ":"Пожелания: ") + w.join(", ") + ".");

  if (A.deal==="daily" && A.date_from && A.date_to){        // посуточно — конкретные даты
    const n = nights(A.date_from, A.date_to);
    const nl = uz ? n+" kecha" : L().nights(n);
    p.push(uz
      ? `Sanalar: ${dLong(A.date_from,"uz")}dan ${dLong(A.date_to,"uz")}gacha — ${nl}.`
      : `Даты: заезд ${dLong(A.date_from,"ru")}, выезд ${dLong(A.date_to,"ru")} — ${nl}.`);
  } else if (A.deal==="rent"){
    if (A.movein==="date" && A.movein_date){               // длительная — точная дата заезда
      p.push(uz ? `${dLong(A.movein_date,"uz")}dan kirishni rejalashtiryapman.`
                : `Заезд планирую с ${dLong(A.movein_date,"ru")}.`);
    } else {
      const MV = uz ? {now:"Darhol kirishga tayyorman.",month:"Bir oy ichida kiraman.",
                       flex:"Muddat bo'yicha moslashuvchanman."}
                    : {now:"Готов заехать сразу.",month:"Заезд в течение месяца.",flex:"По срокам гибко."};
      if (MV[A.movein]) p.push(MV[A.movein]);
    }
  }

  p.push(A.object==="flat"       // этаж уместен только для квартиры
    ? (uz ? "Mos variant bo'lsa — foto, aniq manzil, qavati, maydoni va narxini yuboring. Vositachilik haqini ham yozing."
          : "Если есть подходящие варианты — пришлите, пожалуйста, фото, точный адрес, этаж, площадь и цену. Сразу уточните размер комиссии.")
    : (uz ? "Mos variant bo'lsa — foto, aniq manzil, maydoni va narxini yuboring. Vositachilik haqini ham yozing."
          : "Если есть подходящие варианты — пришлите, пожалуйста, фото, точный адрес, площадь и цену. Сразу уточните размер комиссии."));

  const link = `https://t.me/${A._bot || "rano_smart_bot"}`;
  if (A.contact==="bot" || A.contact==="both")
    p.push(uz ? `Variantlarni yordamchim Ra'noga yuboring: ${link}\nHavolani bosib yozing — u menga darhol yetkazadi.`
              : `Варианты присылайте, пожалуйста, моей помощнице — Ra'no: ${link}\nНажмите на ссылку и напишите ей, она сразу передаёт мне.`);
  p.push(uz ? "Rahmat!" : "Спасибо!");
  return p.join("\n");
}

document.getElementById("pvhd").onclick = ()=>{
  pvOpen = !pvOpen;
  document.getElementById("pvbody").style.display = pvOpen ? "" : "none";
  document.getElementById("pv").classList.toggle("open", pvOpen);
  tg?.HapticFeedback?.selectionChanged(); refresh();
};

function submit(){
  const payload = JSON.stringify({v: 2, ans: A});
  tg?.HapticFeedback?.notificationOccurred("success");
  if (tg?.sendData) tg.sendData(payload);
  else alert(A.lang==="en" ? "Open this page from the bot button"
            : A.lang==="uz" ? "Sahifani botdagi tugma orqali oching"
            : "Откройте страницу через кнопку в боте");
}

if (tg){
  tg.ready(); tg.expand();
  const applyScheme = ()=>{
    document.body.classList.toggle("dark", tg.colorScheme==="dark");
    try{
      const bg = getComputedStyle(document.body).backgroundColor;
      tg.setBackgroundColor(bg); tg.setHeaderColor(bg);
    }catch(e){}
  };
  applyScheme();
  try{ tg.MainButton.setParams({text:L().submit, color:"#C21F45", text_color:"#ffffff"}); }catch(e){}
  tg.MainButton.show(); tg.MainButton.onClick(submit);
  if (tg.onEvent) tg.onEvent("themeChanged", ()=>{ applyScheme(); render(); });
} else {
  const fab=document.getElementById("fab"); fab.style.display="block"; fab.onclick=submit;
}
render();
</script>
