<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ra'no · поиск жилья</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#faf6f2; --fg:#2a1a1f; --muted:#7a6a6f; --accent:#C21F45; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1416; --fg:#f4ece9; --muted:#b7a7a9; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:420px; padding:32px 20px; text-align:center; }
  h1 { font-size:22px; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 24px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
          padding:14px 22px; border-radius:14px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Параметры теперь — в чате 💬</h1>
  <p>Кнопки больше не нужны. Напишите Ra'no своими словами, что ищете, — например:
     «снять трёшку в Мирабаде до $1400, с ремонтом». Остальное она уточнит сама.</p>
  <a class="btn" id="go" href="https://t.me/rano_smart_bot">Вернуться в чат</a>
</main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData !== undefined) {
    tg.ready();
    document.getElementById("go").onclick = e => { e.preventDefault(); tg.close(); };
  }
</script>
</body>
</html>
