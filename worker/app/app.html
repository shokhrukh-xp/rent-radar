<style>
:root{--bg:#F3F5F4;--card:#FFFFFF;--ink:#111A17;--ink2:#2F3B37;--muted:#4F5C57;--line:#E3E8E6;--line2:#EEF1F0;
--g:#0E6B53;--g-soft:#E6F2ED;--g-ink:#094534;--g-line:#CFE6DC;--a-soft:#FCEBDD;--a-ink:#8A4314;--a:#C25A1C;
--b-soft:#E4ECFA;--b-ink:#1D4A99;--n-soft:#EEF1F0;--n-ink:#3F4B46;--danger:#A23B2A;--shadow:0 1px 2px rgba(17,26,23,.05),0 6px 20px rgba(17,26,23,.05);
--ph:#E7ECEA;--chip:#F3F5F4}
body.dark{--bg:#0E1412;--card:#18201D;--ink:#EAF0ED;--ink2:#C9D3CF;--muted:#9AA8A2;--line:#27322E;--line2:#222B28;
--g:#3FB58A;--g-soft:#17352B;--g-ink:#9EE3C6;--g-line:#24503F;--a-soft:#3A2618;--a-ink:#F2B88D;--a:#E0874D;
--b-soft:#1B2A45;--b-ink:#A9C2F2;--n-soft:#222B28;--n-ink:#C0CBC6;--danger:#F08A78;--shadow:none;--ph:#202A26;--chip:#202A26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
font:15px/1.4 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.005em;overscroll-behavior:none}

a{color:var(--g);text-decoration:none}
#app{display:flex;flex-direction:column;height:var(--tg-viewport-stable-height,100vh);overflow:hidden;position:relative}

.ava{width:40px;height:40px;border-radius:20px;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--g-line)}

main{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.pad{padding:0 16px 110px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.banner img{width:32px;height:32px;border-radius:16px;object-fit:cover;flex:none}
.banner.soft{background:var(--g-soft);box-shadow:none;color:var(--g-ink)}
.chip-btn{min-height:36px;padding:0 12px;border-radius:18px;background:var(--g-soft);color:var(--g-ink);font-size:13px;font-weight:600;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 12px 0 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.fchip b{font-size:12px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--n-soft);color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--card);box-shadow:none}.fchip.on b{background:rgba(255,255,255,.2);color:var(--card)}
.offer{overflow:hidden}
.ph{position:relative;height:200px;background:var(--ph);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;text-align:center;padding:0 40px}
.tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:#111A17;font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px}
.cnt{position:absolute;right:12px;bottom:12px;background:rgba(17,26,23,.62);color:#fff;font-size:12px;font-weight:500;padding:4px 8px;border-radius:999px}
.cmp{position:absolute;right:4px;top:4px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.cmp span{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;background:rgba(17,26,23,.28);color:transparent}
.cmp.on span{background:var(--g);color:#fff}
.stage{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px 5px 8px;border-radius:999px}
.stage i{width:7px;height:7px;border-radius:4px;background:currentColor}
.k-answer{background:var(--b-soft);color:var(--b-ink)}.k-view{background:var(--g-soft);color:var(--g-ink)}
.k-wait{background:var(--n-soft);color:var(--n-ink)}.k-liked{background:var(--a-soft);color:var(--a-ink)}
.k-think{background:var(--n-soft);color:var(--n-ink)}.k-saved{background:rgba(255,255,255,.94);color:#111A17}
.body{display:block;width:100%;padding:14px 16px 6px;text-align:left}
.price{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price .v{font-size:22px;font-weight:700;letter-spacing:-.02em}.price .per{font-size:15px;color:var(--muted);margin-left:-4px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--n-soft);color:var(--n-ink)}
.pill.low{background:var(--a-soft);color:var(--a-ink)}
.facts{margin-top:4px;font-weight:500}
.place{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:14px;color:var(--muted)}
.meta{margin:6px 16px 0;padding:10px 0 12px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;font-size:14px}
.meta div{display:flex;gap:8px;align-items:flex-start}.meta svg{flex:none;margin-top:1px;color:var(--g)}
.empty{text-align:center;color:var(--muted);padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-size:17px}
.bar-float{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
.btn{min-height:52px;border-radius:16px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.pri{background:var(--g);color:#fff}.btn.dark{background:var(--ink);color:var(--card);box-shadow:0 8px 24px rgba(17,26,23,.25)}
.btn.soft{background:var(--g-soft);color:var(--g-ink);border:1px solid var(--g-line)}.btn.white{background:var(--card);box-shadow:0 8px 24px rgba(17,26,23,.18)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}.btn.red{color:var(--danger)}
.btn:disabled{opacity:.5}
.dock{display:grid;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
nav button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav .ic{position:relative;width:60px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
nav .on .ic{background:var(--g-soft);color:var(--g)}
nav .lb{font-size:12px;font-weight:500;color:var(--muted)}nav .on .lb{font-weight:700;color:var(--ink)}
nav .badge{position:absolute;right:10px;top:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--a);color:#fff;font-size:10px;font-weight:700;line-height:12px;text-align:center;border:2px solid var(--card)}
.gal{position:relative;height:300px;background:var(--ph)}
.gal .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.gal .strip::-webkit-scrollbar{display:none}
.gal .strip img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.gal .dots{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:6px}
.gal .dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.6)}.gal .dots i.on{width:18px;background:#fff}
.fab{position:absolute;top:14px;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.94);color:#111A17;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(17,26,23,.15)}
.sheet{position:relative;margin-top:-20px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border-radius:18px;padding:14px 16px}
.box h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.mbar{position:relative;height:8px;border-radius:4px;background:var(--line2)}
.mbar .band{position:absolute;left:25%;right:25%;top:0;bottom:0;border-radius:4px;background:var(--g-line)}
.mbar .dot{position:absolute;top:-7px;width:22px;height:22px;margin-left:-11px;border-radius:11px;background:var(--g);border:4px solid var(--card);box-shadow:0 1px 6px rgba(17,26,23,.3)}
.mlab{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:12px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:12px;align-items:center;min-height:52px}.row+.row{border-top:1px solid var(--line2)}
.row svg{color:var(--g);flex:none}.row small{display:block;font-size:13px;color:var(--muted)}
.bub{max-width:86%;border-radius:16px;padding:9px 12px;font-size:14px;white-space:pre-line}
.bub small{display:block;font-size:11px;margin-top:2px;opacity:.75;white-space:normal}
.bub.me{align-self:flex-end;background:var(--g-soft);color:var(--g-ink);border-radius:16px 16px 4px 16px}
.bub.them{align-self:flex-start;background:var(--bg);border-radius:16px 16px 16px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:var(--card);border-radius:14px;padding:10px 12px}.spec small{display:block;font-size:12px;color:var(--muted)}.spec b{font-weight:600}
.inp{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);width:100%;font-size:15px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.ctable{display:grid;column-gap:10px;align-items:start}
.ctable .lbl{font-size:12px;color:var(--muted);padding:10px 0;border-top:1px solid var(--line2)}
.ctable .c{padding:10px 0;border-top:1px solid var(--line2);font-size:14px}.ctable .c.best{font-weight:700;color:var(--g)}
.ctable .c.best:after{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--g);margin-left:5px;vertical-align:middle}
.ctable img,.ctable .noimg{width:100%;height:64px;object-fit:cover;border-radius:10px;display:block;background:var(--line2)}
#mapwrap{position:absolute;inset:0;display:none}#map{position:absolute;inset:0}
.leaflet-tile-pane{filter:saturate(.35) brightness(1.04)}
body.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.3)}
.mapchips{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:500}
.mchip{background:var(--card);border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(17,26,23,.12)}
.mchip.on{background:var(--a-soft);color:var(--a-ink)}.mchip.pick{background:var(--ink);color:var(--card)}
.pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);white-space:nowrap}
.pin b{min-height:30px;padding:0 10px;border-radius:15px;display:flex;align-items:center;font-size:13px;font-weight:700;background:#fff;color:#111A17;box-shadow:0 2px 8px rgba(17,26,23,.25);border-left:4px solid #3F4B46}
.pin i{width:10px;height:10px;background:#fff;transform:rotate(45deg);margin-top:-6px}
.pin.on b,.pin.on i{background:#111A17;color:#fff}
.workpin{width:34px;height:34px;border-radius:17px;background:#111A17;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(17,26,23,.15);transform:translate(-50%,-50%)}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:var(--card);border-radius:20px;padding:10px;display:flex;gap:12px;align-items:center;text-align:left;box-shadow:0 8px 28px rgba(17,26,23,.18);width:calc(100% - 24px)}
.mapcard img,.mapcard .noimg{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none;background:var(--line2)}
.tl{display:flex;gap:12px}.tl .rail{width:14px;display:flex;flex-direction:column;align-items:center;flex:none}
.tl .rail i{width:14px;height:14px;border-radius:7px;margin-top:3px;background:var(--card);border:3px solid var(--g)}
.tl .rail i.soon{background:var(--g);border:0;box-shadow:0 0 0 4px var(--g-line)}.tl .rail i.past{background:var(--line);border:0}
.tl .rail span{flex:1;width:2px;background:var(--line);margin-top:4px}
.vcard{margin-top:6px;overflow:hidden}.vacts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2)}
.vacts>*{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink)}
.vacts>*+*{border-left:1px solid var(--line2)}.vacts .g{color:var(--g);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 0}.chk+.chk{border-top:1px solid var(--line2)}
.chk .b{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted)}
.chk .b.ok{background:var(--g);color:#fff}.chk .b.bad{background:var(--a);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:14px}
.seg button{min-height:42px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(17,26,23,.15)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:40px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--chip)}
.opt.on{background:var(--g-soft);color:var(--g-ink);box-shadow:inset 0 0 0 1.5px var(--g)}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rooms .opt{min-height:44px;border-radius:12px;font-weight:700}
.rooms .opt.on{background:var(--g);color:#fff;box-shadow:none}
input[type=range]{width:100%;accent-color:var(--g);height:32px}
.tg{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}.tg+.tg{border-top:1px solid var(--line2)}
.tg .tr{width:50px;height:30px;border-radius:15px;position:relative;flex:none;background:#C9D2CE;transition:background .15s}
.tg .tr i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tg.on .tr{background:var(--g)}.tg.on .tr i{left:23px}
.mrow{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.mrow .t{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.mrow .t i{display:block;height:100%;background:var(--g);border-radius:4px}
.overlay{position:absolute;inset:0;background:rgba(17,26,23,.5);display:flex;align-items:flex-end;z-index:900}
.osheet{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.osheet h2{margin:0;font-size:20px;letter-spacing:-.02em}
.tgprev{background:#DCE8E2;border-radius:18px;padding:14px 12px}body.dark .tgprev{background:#1C2A25}
.tgmsg{max-width:84%;background:var(--card);border-radius:16px 16px 16px 6px;overflow:hidden}
.tgmsg img{width:100%;height:120px;object-fit:cover;display:block}.tgmsg p{margin:0;padding:8px 10px 6px;font-size:14px;white-space:pre-line}
.tgmsg span{margin:0 6px 6px;min-height:36px;border-radius:10px;background:var(--g-soft);color:var(--g);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:1000;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:86%;text-align:center}
.skel{background:linear-gradient(90deg,var(--line2),var(--card),var(--line2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.ring circle{transition:stroke-dasharray .3s}
</style>
</head>
