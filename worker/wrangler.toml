# Ra'no — webhook-«лицо» бота: ИИ-интервью сразу, остальное — в очередь для Python на Actions.
# Деплой:  cd worker && npx wrangler deploy
# Секреты: npx wrangler secret put BOT_TOKEN | GEMINI_KEY | OWNER_CHAT | TG_SECRET | SVC_KEY | GH_TOKEN
name = "rano-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GH_REPO = "shokhrukh-xp/rent-radar"
GH_WORKFLOW = "radar.yml"
AI_MODEL = "gemini-3.8-flash"
WAKE_GH = "off"
# Этап 2 — много пользователей: "on" — новые люди по /start становятся клиентами (до USER_LIMIT, дальше лист
# ожидания; владелец управляет командами /users, /approve, /remove, /limit). Выключено — один клиент, как раньше.
MULTI_USER = "on"
# по приглашению: каждый новый человек — заявка владельцу («Пустить: /approve …»), сам по /start не входит
INVITE_ONLY = "on"
USER_LIMIT = "20"            # Python работает на сервере sonar (deploy/server); GitHub Actions — только вручную

[[d1_databases]]
binding = "DB"
database_name = "rano"
database_id = "e31433a9-bb25-4225-ad09-ea6d7caef25c"

# логи воркера в дашборде Cloudflare (Workers → rano-bot → Logs) — для разбора «ничего не пришло»
# cron-триггеров на бесплатном плане 5 на аккаунт, и они заняты — сторож сервера (watchdog) запускается
# каждым запросом к воркеру и раз в 30 минут из GitHub Actions (.github/workflows/watch.yml → GET /watch)

[observability]
enabled = true

# будильник по cron не нужен: radar.yml и так стартует каждые 30 мин (а у аккаунта Cloudflare лимит 5 cron)
